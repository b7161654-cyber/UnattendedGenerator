# Veröffentlicht die Seite über GitHub Pages.
# Voraussetzung: Repository öffentlich. Die Pages-Quelle „GitHub Actions“ wird
# vom Workflow selbst aktiviert, sofern das Secret PAGES_TOKEN gesetzt ist (PAT
# mit „Pages: write“ und „Administration: write“, klassisch genügt `repo`).
# Ohne dieses Secret muss Pages bereits unter Settings → Pages aktiviert sein.
# Gebaut wird mit demselben Skript wie für Freebuff Sites; veröffentlicht werden
# nur die Laufzeitdateien, nicht Tests oder Werkzeuge.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prüfungen ausführen
        run: node tests/run.js

      - name: Paket für die Veröffentlichung bauen
        run: node tools/build-site.js

      # GITHUB_TOKEN darf Pages nicht anlegen, deshalb der Umweg über ein PAT.
      # Ohne Secret bleibt der Schritt wirkungslos statt rot zu werden.
      - name: Pages-Quelle aktivieren
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PAGES_TOKEN fehlt – Pages muss bereits unter Settings → Pages aktiviert sein."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Paket hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: freebuff-sites-build/assets

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
